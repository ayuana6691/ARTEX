name: Sync Upstream

on:
  # 定时触发：每天 UTC 时间 00:00（北京时间 08:00）自动运行
  schedule:
    - cron: '0 0 * * *'
  # 允许在 GitHub 网页端手动点击运行测试
  workflow_dispatch:

# 赋予工作流向当前仓库写入代码的权限
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main
